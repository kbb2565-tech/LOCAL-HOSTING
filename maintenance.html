<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintenance | {{ site_name }}</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#0a0a12;font-family:'Rajdhani',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
        
        /* Background Canvas */
        canvas{position:fixed;inset:0;z-index:0;opacity:0.4;pointer-events:none}

        .card{position:relative;z-index:10;background:rgba(10,10,20,0.85);backdrop-filter:blur(20px);border:2px solid {{ theme_color }};border-radius:20px;padding:48px 40px;text-align:center;max-width:420px;box-shadow:0 0 60px {{ theme_color }}22}
        .icon{font-size:64px;margin-bottom:16px;filter:drop-shadow(0 0 20px {{ theme_color }})}
        .title{font-family:'Orbitron',monospace;font-size:22px;font-weight:900;color:{{ theme_color }};letter-spacing:4px;text-shadow:0 0 20px {{ theme_color }};margin-bottom:8px}
        .sub{font-size:14px;color:{{ theme_color }}66;letter-spacing:3px;margin-bottom:24px;font-weight:300}
        .message{background:rgba(0,0,0,0.5);border:2px solid {{ theme_color }}44;border-radius:12px;padding:16px 20px;font-size:15px;color:#d1d5db;line-height:1.6;margin-bottom:24px;font-weight:400}
        .footer{font-size:12px;color:{{ theme_color }}66;letter-spacing:2px;font-weight:300}
    </style>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0b0810">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="APURBO DEV">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/favicon-64.png">
</head>
<body>
    <canvas id="matrix"></canvas>

    <div class="card">
        <div class="icon">🔧</div>
        <div class="title">MAINTENANCE</div>
        <div class="sub">{{ site_name }} • SYSTEMS OFFLINE</div>
        <div class="message">{{ message }}</div>
        <div class="footer">⏳ PLEASE CHECK BACK LATER</div>
    </div>

    <script>
        const AC = '{{ theme_color }}';
        const canvas = document.getElementById('matrix'), ctx = canvas.getContext('2d');
        
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const chars = '0123456789アァカサタナハマヤャラワガザダバパイィキシチニヒミリヰギジヂビピウゥクスツヌフムユュルグズブヅプエェケセテネヘメレヱゲゼデベペオォコソトノホモヨョロヲゴゾドボポヴッン';
        const cols = Math.floor(canvas.width / 14);
        const drops = Array(cols).fill(1);

        setInterval(() => {
            ctx.fillStyle = 'rgba(10,10,18,0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = AC;
            ctx.font = '12px monospace';
            
            for(let i = 0; i < drops.length; i++){
                ctx.fillText(chars[Math.floor(Math.random() * chars.length)], i * 14, drops[i] * 14);
                if(drops[i] * 14 > canvas.height && Math.random() > .98) drops[i] = 0;
                drops[i]++;
            }
        }, 33);
    </script>
<button id="installBtn" style="display:none;position:fixed;right:16px;bottom:16px;z-index:999;padding:12px 18px;border:none;border-radius:12px;background:linear-gradient(110deg,#ff5a5f,#ffc83d);color:#1a0f00;font:800 12px 'DM Mono',monospace;letter-spacing:1.5px;cursor:pointer;box-shadow:0 8px 22px #0008">📲 INSTALL APP</button>
<script>
if ('serviceWorker' in navigator) { navigator.serviceWorker.register('/sw.js'); }
let deferredPrompt = null;
const installBtn = document.getElementById('installBtn');
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; installBtn.style.display = 'block'; });
installBtn.addEventListener('click', async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  installBtn.style.display = 'none';
});
window.addEventListener('appinstalled', () => { installBtn.style.display = 'none'; });
</script>
</body>
</html>
